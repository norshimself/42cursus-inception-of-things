apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
      - name: gitlab
        image: gitlab/gitlab-ce:latest
        env:
        - name: GITLAB_OMNIBUS_CONFIG
          value: |
            external_url 'http://localhost:8081'
            nginx['listen_port'] = 80
            gitlab_rails['initial_root_password'] = 'Zk9v!Qr7mLp2xT4c'
            gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0']
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /-/readiness
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  type: LoadBalancer
  selector:
    app: gitlab
  ports:
  - name: http
    port: 80
    targetPort: 80
