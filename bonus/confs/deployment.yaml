apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoukaddo-playground
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zoukaddo-playground
  template:
    metadata:
      labels:
        app: zoukaddo-playground
    spec:
      containers:
      - name: zoukaddo-playground
        image: wil42/playground:v1
        ports:
        - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: zoukaddo-playground
  namespace: dev
spec:
  type: LoadBalancer
  selector:
    app: zoukaddo-playground
  ports:
  - port: 8888
    targetPort: 8888
